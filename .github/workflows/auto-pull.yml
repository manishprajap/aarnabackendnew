name: Auto Pull to Server
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code on Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/aarnexai.com/aarnexai-backend
            cp .env /tmp/.env.backup 2>/dev/null || true
            sudo chown -R ubuntu:ubuntu .
            git fetch origin
            git reset --hard origin/main
            cp /tmp/.env.backup .env 2>/dev/null || true
            npm install
            NODE_OPTIONS="--max-old-space-size=1024" npm run build
            sudo -H env PATH="$PATH" PM2_HOME=/root/.pm2 pm2 restart aarnexai-backend
            sudo -H env PATH="$PATH" PM2_HOME=/root/.pm2 pm2 save