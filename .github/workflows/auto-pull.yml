name: Auto Pull to Server
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/aarnexai.com/aarnexai-backend
            echo "--- Backing up .env ---"
            cp .env /tmp/.env.backup 2>/dev/null || true
            
            echo "--- Pulling from GitHub ---"
            git fetch origin
            git reset --hard origin/main
            
            echo "--- Restoring .env ---"
            cp /tmp/.env.backup .env 2>/dev/null || true
            
            echo "--- Fixing permissions ---"
            sudo chown -R ubuntu:ubuntu .
            
            echo "--- Installing & Building ---"
            npm install
            npm run build
            
            echo "--- Restarting PM2 ---"
            pm2 restart aarnexai-backend || pm2 start npm --name "aarnexai-backend" -- start -- -p 3001
            pm2 save
            
            echo "--- Deployed Successfully ---"
            ls -la